<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Football Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEFF4; --card:#FFFFFF; --card2:#F7F7FA;
    --ink:#111114; --ink2:#5B6068; --ink3:#8A8F97; --ink4:#B4B8BE;
    --line:#E3E3E9;
    --win:#0E7A3C; --win-l:#B8EDCB; --win-m:#2A9257;
    --gold:#8A5A00; --gold-bg:#FDF3DC;
    --red:#B3261E; --red-bg:#FBE9E7; --red-line:#E8B4AE;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:Manrope,system-ui,-apple-system,sans-serif;
    font-size:17px;line-height:1.45;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

  /* ---------- sticky bar ---------- */
  .sticky{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding-top:14px;margin:0 -16px;padding-left:16px;padding-right:16px;
    box-shadow:0 10px 12px -10px rgba(0,0,0,.14);
  }
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .top h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
  .top .yr{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .lv{display:inline-flex;align-items:center;gap:6px;background:var(--red-bg);
    border-radius:999px;padding:5px 10px}
  .lv i{width:7px;height:7px;border-radius:999px;background:var(--red)}
  .lv span{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--red)}

  nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    font-family:inherit;font-size:15px;font-weight:600;min-height:44px;padding:0 17px;
    background:var(--card);color:var(--ink2);border:0;border-radius:11px;cursor:pointer;white-space:nowrap;
  }
  nav button[aria-current=true]{background:var(--ink);color:#fff;font-weight:700}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--win);outline-offset:2px}

  .status{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border-radius:12px;padding:11px 14px;margin:11px 0 14px;
    font-size:14px;font-weight:600;color:var(--ink2);
  }
  .status b{color:var(--ink);font-weight:800}
  .status .alive{color:var(--red);font-weight:800;white-space:nowrap}

  /* ---------- winner card ---------- */
  .champ{background:var(--win);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
  .champ .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--win-l)}
  .champ .mid{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px}
  .champ .who{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .champ .rec{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1;text-align:right}
  .champ .amt{font-size:19px;font-weight:800;color:var(--win-l);text-align:right;margin-top:3px}
  .champ .why{font-size:14px;font-weight:500;color:#D6F5E2;border-top:1px solid var(--win-m);
    padding-top:11px;margin-top:13px}

  /* ---------- standings ---------- */
  h2{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ink2);
    text-transform:uppercase;margin:22px 0 9px}
  .board{display:flex;flex-direction:column;gap:5px}
  .en{background:var(--card);border-radius:13px;border:1px solid transparent}
  .en.top{border-color:#7FC49B}
  .en.out{background:var(--card2)}
  .en > summary{
    display:flex;align-items:center;gap:12px;padding:11px 13px;min-height:44px;
    cursor:pointer;list-style:none;
  }
  .en > summary::-webkit-details-marker{display:none}
  .rk{width:24px;flex:0 0 24px;text-align:right;font-size:15px;font-weight:700;color:var(--ink3)}
  .en.top .rk{color:var(--win);font-weight:800}
  .en.out .rk{color:var(--ink4)}
  .id{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;
    flex-wrap:wrap;gap:4px 8px}
  .id .init{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .en.out .id .init{color:var(--ink3)}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .pt{display:block;font-size:12px;font-weight:800;color:var(--gold);
    background:var(--gold-bg);border-radius:5px;padding:3px 7px;line-height:1.25}
  .no{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--red);
    border:1px solid var(--red-line);border-radius:5px;padding:3px 6px;line-height:1.25}
  .fig{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;
    margin-left:auto;flex:0 0 auto}
  .fig .r{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .en.out .fig .r{color:var(--ink3)}
  .fig .m{display:block;font-size:12px;font-weight:700;color:var(--ink3);line-height:1.15}
  .en.out .fig .m{color:var(--ink4)}
  .cv{width:14px;flex:0 0 14px;color:var(--ink4);font-size:13px}
  .en[open] .cv{transform:rotate(90deg)}

  /* ---------- expanded picks ---------- */
  .det{padding:0 13px 14px 49px}
  .pk{display:flex;align-items:baseline;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
  .pk .mk{width:17px;flex:0 0 17px;font-weight:800;font-size:14px}
  .pk.w .mk{color:var(--win)}
  .pk.l{color:var(--ink3)}
  .pk.l .mk{color:var(--ink4)}
  .pk .tm{font-weight:700;width:46px;flex:0 0 46px}
  .pk.l .tm{font-weight:600}
  .pk .gm{color:var(--ink2);font-size:14px}
  .pk.l .gm{color:var(--ink4)}
  .tbl{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:14px;color:var(--ink2);font-weight:600}
  .tbl b{color:var(--ink);font-weight:800}

  /* ---------- tiebreakers ---------- */
  .tb{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:10px}
  .tb .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .tb .t{font-size:15px;font-weight:700}
  .tb .g{font-size:13px;font-weight:500;color:var(--ink2);margin-top:1px}
  .tb .v{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .tb .v.none{font-size:30px;color:var(--ink4)}
  .tb ol{margin:12px 0 0;padding:0;list-style:none}
  .tb li{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-top:1px solid var(--line);font-size:16px}
  .tb li .n{font-weight:600;color:var(--ink2)}
  .tb li .n b{color:var(--ink);font-weight:700}
  .tb li .o{font-size:13px;font-weight:600;color:var(--ink3);white-space:nowrap}
  .tb li.best .n{color:var(--ink)}
  .tb li.best .n b{font-weight:800}
  .tb li.best .o{font-weight:800;color:var(--gold)}

  /* ---------- in progress ---------- */
  .ip{background:var(--card);border-radius:18px;padding:2px 18px}
  .ip .r{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-top:1px solid var(--line)}
  .ip .r:first-child{border-top:0}
  .ip .s{font-size:16px;font-weight:700}
  .ip .c{font-size:13px;font-weight:500;color:var(--ink2);margin-top:1px}
  .ip .p{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}

  /* ---------- season ---------- */
  .sn{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
  .sn th{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink2);text-align:right;padding:12px 8px;border-bottom:1px solid var(--line)}
  .sn th:first-child{text-align:left}
  .sn td{padding:12px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
  .sn td:first-child{text-align:left;padding-left:14px;font-size:18px;font-weight:700}
  .sn td.r{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .sn td.up{color:var(--win);font-weight:800}
  .sn td.flat{color:var(--ink3);font-weight:700}
  .sn td.dn{color:#C0564E;font-weight:700}
  .sn td.srk{text-align:right;font-size:15px;font-weight:700;color:var(--ink3);
    padding-left:14px;padding-right:2px;width:30px}
  .sn th.srk{text-align:right;padding-left:14px;padding-right:2px}
  .sn td:first-child{padding-left:14px}
  .sn td.nm{text-align:left;font-size:18px;font-weight:700;padding-left:10px}
  .sn th.nm{text-align:left;padding-left:10px}
  .sn tr:last-child td{border-bottom:0}
  .pot{font-size:13px;color:var(--ink2);margin:10px 0 0;font-weight:600}

  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink3);line-height:1.6}
  .flag{background:var(--gold-bg);border-radius:12px;padding:12px 14px;
    font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px}
  .empty{padding:44px 10px;text-align:center;color:var(--ink3)}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

const NORM={PHI:'PHL',PHL:'PHL',ARI:'AZ',AZ:'AZ',LA:'LAR',LAR:'LAR',JAC:'JAX',JAX:'JAX',
  WSH:'WAS',WAS:'WAS',GNB:'GB',KAN:'KC',NWE:'NE',NOR:'NO',SFO:'SF',TAM:'TB',LVR:'LV',OAK:'LV',SD:'LAC',STL:'LAR'};
const N=v=>{const s=String(v==null?'':v).trim().toUpperCase();return NORM[s]||s;};

const STORED={
  1:{final:true,mnf:41,sf:379,
     winners:{'NE @ SEA':'SEA','SF @ LAR':'SF','TB @ CIN':'CIN','NO @ DET':'DET','NYJ @ TEN':'NYJ',
       'BAL @ IND':'BAL','ATL @ PIT':'PIT','CHI @ CAR':'CHI','CLE @ JAX':'JAX','BUF @ HOU':'BUF',
       'MIA @ LV':'LV','GB @ MIN':'MIN','WAS @ PHL':'PHL','AZ @ LAC':'AZ','DAL @ NYG':'NYG','DEN @ KC':'KC'},
     lines:{'DEN @ KC':'KC 31, DEN 10','SF @ LAR':'SF 27, LAR 7'}}
};

const BUYIN=100, PRIZE=100;
let DATA=null, RES=JSON.parse(JSON.stringify(STORED)), view=null, openRows={};
const $=id=>document.getElementById(id);

(async function(){
  try{ const r=await fetch('picks.json',{cache:'no-store'}); DATA=r.ok?await r.json():FALLBACK; }
  catch(e){ DATA=FALLBACK; }
  const ws=Object.keys(DATA.weeks).map(Number).sort((a,b)=>a-b);
  view=ws[ws.length-1];
  render(); poll(); setInterval(poll,30000);
})();

/* ---------------- live ---------------- */
async function poll(){
  if(!DATA) return;
  const ws=Object.keys(DATA.weeks).map(Number).filter(n=>!(RES[n]&&RES[n].final));
  let any=false, anyLive=false;
  for(const n of ws){
    try{
      const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&dates=2026&week='+n);
      if(!r.ok) continue;
      const j=await r.json(), wk=DATA.weeks[n];
      const winners={},prog={},lines={};let done=true,mnf=null,sf=null;
      (j.events||[]).forEach(ev=>{
        const c=(ev.competitions||[])[0]; if(!c) return;
        const cs=c.competitors||[];
        const A=cs.find(x=>x.homeAway==='away'), H=cs.find(x=>x.homeAway==='home');
        if(!A||!H) return;
        const a=N(A.team.abbreviation), h=N(H.team.abbreviation);
        const key=wk.games.find(g=>{const p=g.split('@').map(s=>N(s));return p[0]===a&&p[1]===h;});
        if(!key) return;
        const as=+A.score, hs=+H.score;
        const st=c.status&&c.status.type||{};
        if(st.completed||st.state==='in') lines[key]=a+' '+as+', '+h+' '+hs;
        if(st.completed){ winners[key]= as>hs?a:(hs>as?h:'TIE'); }
        else if(st.state==='in'){ done=false; anyLive=true;
          prog[key]={lead:as>hs?a:(hs>as?h:null),clock:st.shortDetail||'',line:lines[key]}; }
        else { done=false; }
        if(key===wk.games[wk.games.length-1] && !isNaN(as+hs) && (st.completed||st.state==='in')) mnf=as+hs;
      });
      RES[n]=Object.assign({},RES[n]||{},{winners,prog,lines,final:done,mnf:mnf,sf:(RES[n]||{}).sf});
      any=true;
    }catch(e){}
  }
  if(any){ RES.__live=anyLive; render(); }
}

/* ---------------- scoring ---------------- */
function score(n){
  const wk=DATA.weeks[n], r=RES[n]||{};
  const win=r.winners||{}, prog=r.prog||{};
  const decided=wk.games.filter(g=>win[g]).length;
  const rows=wk.entries.map(nm=>{
    let w=0,l=0;
    const detail=wk.games.map((g,i)=>{
      const p=N(wk.picks[nm][i]), res=win[g];
      if(res){ const ok = res==='TIE'||p===res; ok?w++:l++; return {g,p,s:ok?'w':'l'}; }
      return {g,p,s:''};
    });
    return {nm,w,l,detail,max:w+(wk.games.length-decided),
      mnf:wk.mnf[nm], sf:wk.sf[nm]};
  });
  const best=Math.max(...rows.map(x=>x.w));
  const running = decided>0 && decided<wk.games.length;
  rows.forEach(x=>x.out = running && x.max<best);
  rows.sort((a,b)=>b.w-a.w||a.nm.localeCompare(b.nm));

  // single weekly winner: wins, then closest MNF points
  let champ=null, tiedTwo=false;
  if(decided===wk.games.length){
    const lead=rows.filter(x=>x.w===best);
    if(lead.length===1){ champ={r:lead[0],why:'Most wins outright.'}; }
    else if(r.mnf!=null){
      const withD=lead.map(x=>({x,d:typeof x.mnf==='number'?Math.abs(x.mnf-r.mnf):Infinity}))
        .sort((a,b)=>a.d-b.d);
      if(withD.length>1 && withD[0].d===withD[1].d){ tiedTwo=true; }
      else{
        const others=lead.filter(y=>y!==withD[0].x).map(y=>y.nm).join(', ');
        champ={r:withD[0].x,
          why:'Tied '+others+' at '+best+'\u2013'+(wk.games.length-best)
            +', won on Monday points. Guessed '+withD[0].x.mnf+' against '+r.mnf+'.'};
      }
    }
  }
  return {rows,decided,total:wk.games.length,best,champ,tiedTwo,prog};
}
function near(rows,key,actual){
  if(actual==null) return null;
  return rows.filter(x=>typeof x[key]==='number')
    .map(x=>({nm:x.nm,v:x[key],d:Math.abs(x[key]-actual)}))
    .sort((a,b)=>a.d-b.d);
}
function points(n){
  const S=score(n), r=RES[n]||{}, out={};
  if(S.decided!==S.total) return out;
  [['mnf',r.mnf],['sf',r.sf]].forEach(([k,a])=>{
    const L=near(S.rows,k,a); if(!L||!L.length) return;
    const b=L[0].d;
    L.filter(x=>x.d===b).forEach(x=>{ (out[x.nm]=out[x.nm]||[]).push(k==='mnf'?'points':'yards'); });
  });
  return out;
}

/* ---------------- render ---------------- */
function render(){
  const ws=Object.keys(DATA.weeks).map(Number).sort((a,b)=>a-b);
  $('nav').innerHTML = ws.map(n=>'<button data-v="'+n+'" aria-current="'+(view===n)+'">Wk '+n+'</button>').join('')
    + '<button data-v="season" aria-current="'+(view==='season')+'">Season</button>';
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    view=b.dataset.v==='season'?'season':+b.dataset.v; openRows={}; render();
    window.scrollTo({top:0});
  });
  $('yr').innerHTML = RES.__live ? '<span class="lv"><i></i><span>LIVE</span></span>' : '2026&ndash;27';
  $('body').innerHTML = view==='season'?season():week(view);
  $('body').querySelectorAll('details.en').forEach(d=>{ d.ontoggle=()=>{ openRows[d.dataset.nm]=d.open; }; });
}

function week(n){
  const wk=DATA.weeks[n], S=score(n), r=RES[n]||{}, pts=points(n);
  const left=S.total-S.decided;
  const alive=S.rows.filter(x=>!x.out).length;

  $('status').innerHTML = S.decided===0
    ? '<span>'+wk.label+' &middot; not started</span><span class="alive">'+S.total+' games</span>'
    : left===0
      ? '<span>'+wk.label+' &middot; <b>final</b></span><span>Leader <b>'+S.best+'&ndash;'+(S.total-S.best)+'</b></span>'
      : '<span>Leader <b>'+S.best+'&ndash;'+(S.decided-S.best)+'</b> &middot; <b>'+left+'</b> games left</span>'
        +'<span class="alive">'+alive+' can still win</span>';

  let o='';
  if(S.tiedTwo){
    o+='<div class="flag">Tied on wins and on Monday points. Lisa decides this one.</div>';
  }
  if(S.champ){
    const c=S.champ.r;
    o+='<div class="champ"><div class="lbl">'+wk.label.toUpperCase()+' WINNER</div>'
      +'<div class="mid"><div class="who">'+c.nm+'</div>'
      +'<div><div class="rec">'+c.w+'&ndash;'+c.l+'</div><div class="amt">+$'+PRIZE+'</div></div></div>'
      +'<div class="why">'+S.champ.why+'</div></div>';
  }

  o+='<h2>Standings</h2><div class="board">';
  let rk=0,prev=null;
  S.rows.forEach((x,i)=>{
    if(x.w!==prev){ rk=i+1; prev=x.w; }
    const isTop = S.champ ? x===S.champ.r : (S.decided>0 && x.w===S.best);
    const p=pts[x.nm];
    o+='<details class="en'+(isTop?' top':'')+(x.out?' out':'')+'" data-nm="'+x.nm+'"'
      +(openRows[x.nm]?' open':'')+'>'
      +'<summary><div class="rk">'+rk+'</div>'
      +'<div class="id"><div class="init">'+x.nm+'</div>'
        +((p||x.out)?'<div class="tags">'
          +(p?'<div class="pt">+1 on '+p.join(' &amp; ')+'</div>':'')
          +(x.out?'<div class="no">CAN\u2019T WIN</div>':'')
          +'</div>':'')
      +'</div>'
      +'<div class="fig"><div class="r">'+x.w+'&ndash;'+x.l+'</div>'
        +(left>0?'<div class="m">max '+x.max+'</div>':'')+'</div>'
      +'<div class="cv">&#9656;</div></summary>'
      +'<div class="det">'
      + x.detail.map(d=>'<div class="pk '+d.s+'"><span class="mk">'
          +(d.s==='w'?'W':d.s==='l'?'L':'&middot;')+'</span>'
          +'<span class="tm">'+d.p+'</span><span class="gm">'+d.g+'</span></div>').join('')
      +'<div class="tbl">Monday points <b>'+(x.mnf==null?'&mdash;':x.mnf)
        +'</b> &nbsp; 49ers yards <b>'+(x.sf==null?'&mdash;':x.sf)+'</b></div>'
      +'</div></details>';
  });
  o+='</div>';

  const live=Object.keys(S.prog||{});
  if(live.length){
    o+='<h2>In progress</h2><div class="ip">';
    live.forEach(g=>{
      const p=S.prog[g];
      const cnt=wk.entries.filter((e,i)=>N(wk.picks[e][wk.games.indexOf(g)])===p.lead).length;
      o+='<div class="r"><div><div class="s">'+(p.line||g)+'</div>'
        +'<div class="c">'+p.clock+'</div></div>'
        +'<div class="p">'+(p.lead?cnt+' picked '+p.lead:'tied')+'</div></div>';
    });
    o+='</div>';
  }

  o+='<h2>Tiebreakers</h2>';
  const mg=wk.games[wk.games.length-1];
  o+=tb('Monday night points',mg,r.mnf,(r.lines||{})[mg],near(S.rows,'mnf',r.mnf));
  const sg=wk.games.find(g=>g.split('@').map(s=>N(s)).indexOf('SF')>=0);
  o+=tb('49ers total yards',sg||'49ers on bye',r.sf,sg?(r.lines||{})[sg]:null,near(S.rows,'sf',r.sf));
  return o;
}

function tb(title,game,actual,line,list){
  let o='<div class="tb"><div class="hd"><div><div class="t">'+title+'</div>'
    +'<div class="g">'+game+(line?' &middot; '+line:'')+'</div></div>'
    +(actual==null?'<div class="v none">&mdash;</div>':'<div class="v">'+actual+'</div>')
    +'</div>';
  if(list&&list.length){
    const b=list[0].d;
    o+='<ol>'+list.slice(0,5).map(x=>'<li class="'+(x.d===b?'best':'')+'">'
      +'<span class="n"><b>'+x.nm+'</b> '+x.v+'</span>'
      +'<span class="o">off '+x.d+'</span></li>').join('')+'</ol>';
  }
  return o+'</div>';
}

function season(){
  const ws=Object.keys(DATA.weeks).map(Number).sort((a,b)=>a-b);
  const t={}; let done=0;
  const add=(nm,k,v)=>{ (t[nm]=t[nm]||{w:0,l:0,won:0,pt:0})[k]+=v; };
  ws.forEach(n=>{
    const S=score(n);
    if(!S.decided) return;
    S.rows.forEach(x=>{ add(x.nm,'w',x.w); add(x.nm,'l',x.l); });
    if(S.decided===S.total){
      done++;
      if(S.champ) add(S.champ.r.nm,'won',1);
      const p=points(n);
      Object.keys(p).forEach(nm=>add(nm,'pt',p[nm].length));
    }
  });
  const rows=Object.entries(t).map(([nm,v])=>({nm,...v,
    money:(v.won*PRIZE)-BUYIN})).sort((a,b)=>b.won-a.won||b.w-a.w||b.pt-a.pt);
  if(!rows.length){ $('status').innerHTML='<span>Season &middot; no completed weeks</span>'; return '<div class="empty">Nothing final yet.</div>'; }

  const leader=rows[0];
  $('status').innerHTML='<span>Season &middot; <b>'+done+'</b> week'+(done>1?'s':'')+' complete</span>'
    +'<span>Leader <b>'+leader.nm+'</b></span>';

  let o='<h2>Season standings</h2>'
    +'<table class="sn"><thead><tr><th class="srk">#</th><th class="nm">Entry</th>'
    +'<th>Record</th><th>Won</th><th>Pts</th><th>Money</th></tr></thead><tbody>';
  let srk=0, sprev=null;
  rows.forEach((x,i)=>{
    const key=x.money+'|'+x.w;
    if(key!==sprev){ srk=i+1; sprev=key; }
    const cls = x.money>0?'up':(x.money===0?'flat':'dn');
    const amt = x.money>0?'+$'+x.money:(x.money===0?'$0':'\u2212$'+Math.abs(x.money));
    o+='<tr><td class="srk">'+srk+'</td><td class="nm">'+x.nm+'</td>'
      +'<td class="r">'+x.w+'&ndash;'+x.l+'</td>'
      +'<td>'+(x.won||'&mdash;')+'</td><td>'+(x.pt||'&mdash;')+'</td>'
      +'<td class="'+cls+'">'+amt+'</td></tr>';
  });
  o+='</tbody></table>';
  o+='<p class="pot">Everyone starts at &minus;$'+BUYIN+'. Each week won adds $'+PRIZE
    +'. The two season categories pay $'+PRIZE+' each at the end.</p>';
  return o;
}
